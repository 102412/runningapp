name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runningapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Superuser so tests can CREATE DATABASE (per-suite isolation) and CREATE EXTENSION.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/runningapp
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runningapp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install ffmpeg (media pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dead code and unused dependencies
        run: pnpm deadcode

      - name: Migrations apply cleanly to an empty database
        run: pnpm db:migrate

      - name: Generated DB types are up to date
        run: |
          pnpm db:codegen
          git diff --exit-code apps/api/src/platform/db/generated.ts

      - name: OpenAPI spec and generated client types are up to date
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json docs/API_REFERENCE.md packages/api-client/src/generated

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Seed smoke test (the demo world still builds through the real services)
        run: |
          pnpm db:reset
          pnpm db:seed -- --no-media

  docker:
    # Builds the production image and proves the bundled API / worker / migration runner start.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t runningapp-api:ci .
      - name: ffmpeg is present in the image
        run: docker run --rm --entrypoint ffmpeg runningapp-api:ci -version
      - name: Migrations apply and the API reports ready
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          COMMON="--network ci -e NODE_ENV=production -e DATABASE_URL=postgres://postgres:postgres@pg:5432/app \
            -e JWT_SECRET=ci-jwt-secret-that-is-long-enough-123456789 -e MEDIA_SIGNING_SECRET=ci-media-secret-that-is-long-enough-12345 \
            -e MAIL_DRIVER=smtp -e SMTP_URL=smtp://localhost:2525 -e STORAGE_DRIVER=s3 -e S3_BUCKET=ci -e S3_ACCESS_KEY_ID=ci -e S3_SECRET_ACCESS_KEY=ci \
            -e CORS_ORIGINS=https://app.example.com -e PUBLIC_BASE_URL=https://api.example.com"
          docker run --rm $COMMON runningapp-api:ci node dist/migrate.js
          docker run -d --name api $COMMON runningapp-api:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && exit 0; sleep 2; done
          docker logs api
          exit 1

  audit:
    # Advisory: reports known-vulnerable production dependencies without blocking merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod
