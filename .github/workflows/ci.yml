name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runningapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Superuser so tests can CREATE DATABASE (per-suite isolation) and CREATE EXTENSION.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/runningapp
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runningapp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install ffmpeg (media pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations apply cleanly to an empty database
        run: pnpm db:migrate

      - name: Generated DB types are up to date
        run: |
          pnpm db:codegen
          git diff --exit-code apps/api/src/platform/db/generated.ts

      - name: OpenAPI spec and generated client types are up to date
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json packages/api-client/src/generated

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
