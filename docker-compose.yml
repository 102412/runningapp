# Local development infrastructure.
#   docker compose up -d                     # Postgres only (enough to run the API + tests)
#   docker compose --profile s3 up -d        # + MinIO (S3-compatible object storage)
#   docker compose --profile mail up -d      # + Mailpit (SMTP sink with a web UI on :8025)
#   docker compose --profile redis up -d     # + Redis (shared rate-limit store)
# The API itself runs on the host (`pnpm dev`) for fast reloads; it is not containerised here.
name: runningapp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runningapp
      POSTGRES_PASSWORD: runningapp
      POSTGRES_DB: runningapp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runningapp -d runningapp']
      interval: 5s
      timeout: 3s
      retries: 10
    # The `runningapp` role owns the cluster here, so tests can create/drop per-suite databases.

  redis:
    profiles: ['redis']
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ['s3']
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-setup:
    profiles: ['s3']
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/runningapp-media &&
      mc anonymous set none local/runningapp-media &&
      mc cors set local/runningapp-media /dev/null || true"

  mailpit:
    profiles: ['mail']
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  pgdata:
  miniodata:
